<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Subtle Grid -->
  <g stroke="#262626" stroke-width="1" stroke-dasharray="4 4" opacity="0.4">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Browser Header Frame -->
  <rect x="60" y="50" width="680" height="400" rx="12" fill="#121212" stroke="#2e2e2e" stroke-width="1.5"/>
  <rect x="60" y="50" width="680" height="44" rx="12" fill="#1c1c1c"/>
  <rect x="60" y="82" width="680" height="12" fill="#1c1c1c"/>
  
  <!-- Browser Dots -->
  <circle cx="85" cy="72" r="5" fill="#404040"/>
  <circle cx="102" cy="72" r="5" fill="#404040"/>
  <circle cx="119" cy="72" r="5" fill="#404040"/>
  <rect x="150" y="63" width="300" height="18" rx="4" fill="#262626"/>
  <text x="165" y="76" fill="#a3a3a3" font-family="-apple-system, sans-serif" font-size="11">ecobazar.store — Responsive Organic Marketplace</text>

  <!-- E-commerce UI inside -->
  <!-- Top announcement & navigation bar -->
  <rect x="80" y="110" width="640" height="35" rx="6" fill="#1a1a1a" stroke="#282828" stroke-width="1"/>
  <text x="100" y="132" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">ECOBAZAR</text>
  <rect x="230" y="118" width="220" height="18" rx="4" fill="#262626"/>
  <circle cx="680" cy="127" r="10" fill="#262626"/>
  <circle cx="650" cy="127" r="10" fill="#262626"/>

  <!-- Hero Banner inside web view -->
  <rect x="80" y="160" width="640" height="120" rx="8" fill="url(#cardGrad)" stroke="#333333" stroke-width="1"/>
  <text x="110" y="200" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="20" font-weight="700">Fresh &amp; Organic Food Store</text>
  <text x="110" y="225" fill="#a3a3a3" font-family="-apple-system, sans-serif" font-size="12">Interactive Swiper hero banner with dynamic category filtering</text>
  <rect x="110" y="242" width="100" height="24" rx="4" fill="#ffffff"/>
  <text x="135" y="258" fill="#000000" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Shop Now</text>

  <!-- Product Grid -->
  <g transform="translate(80, 300)">
    <rect x="0" y="0" width="145" height="125" rx="6" fill="#171717" stroke="#262626" stroke-width="1"/>
    <rect x="15" y="15" width="115" height="55" rx="4" fill="#262626"/>
    <rect x="15" y="80" width="90" height="10" rx="2" fill="#525252"/>
    <rect x="15" y="98" width="50" height="12" rx="2" fill="#ffffff"/>

    <rect x="165" y="0" width="145" height="125" rx="6" fill="#171717" stroke="#262626" stroke-width="1"/>
    <rect x="180" y="15" width="115" height="55" rx="4" fill="#262626"/>
    <rect x="180" y="80" width="90" height="10" rx="2" fill="#525252"/>
    <rect x="180" y="98" width="50" height="12" rx="2" fill="#ffffff"/>

    <rect x="330" y="0" width="145" height="125" rx="6" fill="#171717" stroke="#262626" stroke-width="1"/>
    <rect x="345" y="15" width="115" height="55" rx="4" fill="#262626"/>
    <rect x="345" y="80" width="90" height="10" rx="2" fill="#525252"/>
    <rect x="345" y="98" width="50" height="12" rx="2" fill="#ffffff"/>

    <rect x="495" y="0" width="145" height="125" rx="6" fill="#171717" stroke="#262626" stroke-width="1"/>
    <rect x="510" y="15" width="115" height="55" rx="4" fill="#262626"/>
    <rect x="510" y="80" width="90" height="10" rx="2" fill="#525252"/>
    <rect x="510" y="98" width="50" height="12" rx="2" fill="#ffffff"/>
  </g>
</svg>
