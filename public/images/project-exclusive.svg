  <text x="240" y="132" fill="#a3a3a3" font-family="-apple-system, sans-serif" font-size="11">Home    Contact    About    Sign Up</text>
  <rect x="490" y="118" width="150" height="18" rx="4" fill="#262626"/>
  <circle cx="680" cy="127" r="8" fill="#525252"/>

  <!-- Flash Sales Section -->
  <rect x="80" y="160" width="640" height="45" rx="6" fill="#1f1f1f"/>
  <rect x="95" y="172" width="12" height="20" rx="2" fill="#ffffff"/>
  <text x="118" y="187" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Today's Flash Sales</text>
  <text x="490" y="187" fill="#a3a3a3" font-family="-apple-system, sans-serif" font-size="12">03d : 14h : 36m : 42s</text>

  <!-- Product Showcase Cards -->
  <g transform="translate(80, 220)">
    <rect x="0" y="0" width="195" height="200" rx="8" fill="#171717" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="15" y="15" width="165" height="100" rx="6" fill="#242424"/>
    <rect x="15" y="125" width="120" height="12" rx="2" fill="#737373"/>
    <text x="15" y="158" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">$120.00</text>
    <rect x="15" y="172" width="165" height="28" rx="4" fill="#ffffff"/>
    <text x="65" y="190" fill="#000000" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Add To Cart</text>

    <rect x="222" y="0" width="195" height="200" rx="8" fill="#171717" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="237" y="15" width="165" height="100" rx="6" fill="#242424"/>
    <rect x="237" y="125" width="120" height="12" rx="2" fill="#737373"/>
    <text x="237" y="158" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">$960.00</text>
    <rect x="237" y="172" width="165" height="28" rx="4" fill="#ffffff"/>
    <text x="287" y="190" fill="#000000" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Add To Cart</text>

    <rect x="445" y="0" width="195" height="200" rx="8" fill="#171717" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="460" y="15" width="165" height="100" rx="6" fill="#242424"/>
    <rect x="460" y="125" width="120" height="12" rx="2" fill="#737373"/>
    <text x="460" y="158" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">$370.00</text>
    <rect x="460" y="172" width="165" height="28" rx="4" fill="#ffffff"/>
    <text x="510" y="190" fill="#000000" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Add To Cart</text>
