<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>
  
  <!-- Subtle Grid -->
  <g stroke="#262626" stroke-width="1" stroke-dasharray="4 4" opacity="0.35">
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="380" x2="800" y2="380"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="550" y1="0" x2="550" y2="500"/>
  </g>

  <!-- Browser Frame -->
  <rect x="60" y="50" width="680" height="400" rx="12" fill="#111111" stroke="#2e2e2e" stroke-width="1.5"/>
  <rect x="60" y="50" width="680" height="44" rx="12" fill="#181818"/>
  <rect x="60" y="82" width="680" height="12" fill="#181818"/>
  
  <!-- Browser Dots -->
  <circle cx="85" cy="72" r="5" fill="#404040"/>
  <circle cx="102" cy="72" r="5" fill="#404040"/>
  <circle cx="119" cy="72" r="5" fill="#404040"/>
  <rect x="150" y="63" width="280" height="18" rx="4" fill="#262626"/>
  <text x="165" y="76" fill="#a3a3a3" font-family="-apple-system, sans-serif" font-size="11">exclusive.shop — Minimalist E-Commerce Platform</text>

  <!-- Exclusive Header -->
  <rect x="80" y="110" width="640" height="35" rx="6" fill="#171717" stroke="#262626" stroke-width="1"/>
